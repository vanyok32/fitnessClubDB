<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренеры - Fitness Club</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <h1 class="logo">Fitness Club</h1>
        <ul class="nav-menu">
            <li><a href="index.html">Главная</a></li>
            <li><a href="clubs.html">Клубы</a></li>
            <li><a href="coaches.html" class="active">Тренеры</a></li>
            <li><a href="schedules.html">Расписание</a></li>
            <li><a href="workouts.html">Тренировки</a></li>
            <li><a href="login.html">Вход</a></li>
        </ul>
    </div>
</nav>

<main class="container">
    <div class="page-header">
        <h2>Тренеры</h2>
    </div>

    <div id="message-container"></div>

    <div class="filters">
        <div class="form-group">
            <label for="filter-club">Клуб:</label>
            <select id="filter-club">
                <option value="">Все клубы</option>
            </select>
        </div>
        <div class="form-group">
            <label for="filter-spec">Специализация:</label>
            <select id="filter-spec">
                <option value="">Все специализации</option>
            </select>
        </div>
        <div class="form-group">
            <label for="sort-by">Сортировка:</label>
            <select id="sort-by">
                <option value="id">По ID</option>
                <option value="club">По клубу</option>
                <option value="specialization">По специализации</option>
            </select>
        </div>
        <div class="form-group">
            <button class="btn" onclick="applyFilters()">Применить</button>
        </div>
    </div>

    <div class="table-container">
        <table id="coaches-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Email</th>
                <th>Клуб</th>
                <th>Специализации</th>
            </tr>
            </thead>
            <tbody id="coaches-tbody">
            <tr>
                <td colspan="5" class="loading">Загрузка...</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2024 Fitness Club. Все права защищены.</p>
    </div>
</footer>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/coaches.js"></script>
</body>
</html>
