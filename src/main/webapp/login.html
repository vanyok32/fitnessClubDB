<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Fitness Club</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <h1 class="logo">Fitness Club</h1>
        <ul class="nav-menu">
            <li><a href="index.html">Главная</a></li>
            <li><a href="clubs.html">Клубы</a></li>
            <li><a href="coaches.html">Тренеры</a></li>
            <li><a href="schedules.html">Расписание</a></li>
            <li><a href="workouts.html">Тренировки</a></li>
            <li><a href="login.html" class="active">Вход</a></li>
        </ul>
    </div>
</nav>

<main class="container">
    <div class="form-container">
        <h2>Вход / Регистрация</h2>
        <div id="message-container"></div>

        <div id="login-section">
            <h3>Вход</h3>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn">Войти</button>
                </div>
            </form>
        </div>

        <hr style="margin: 2rem 0;">

        <div id="register-section">
            <h3>Регистрация</h3>
            <form id="register-form">
                <div class="form-group">
                    <label for="register-name">Имя:</label>
                    <input type="text" id="register-name" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email:</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-club-id">ID Клуба:</label>
                    <input type="number" id="register-club-id" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-success">Зарегистрироваться</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2024 Fitness Club. Все права защищены.</p>
    </div>
</footer>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
