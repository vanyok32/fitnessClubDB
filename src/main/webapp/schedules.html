<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание - Fitness Club</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <h1 class="logo">Fitness Club</h1>
        <ul class="nav-menu">
            <li><a href="index.html">Главная</a></li>
            <li><a href="clubs.html">Клубы</a></li>
            <li><a href="coaches.html">Тренеры</a></li>
            <li><a href="schedules.html" class="active">Расписание</a></li>
            <li><a href="workouts.html">Тренировки</a></li>
            <li><a href="login.html">Вход</a></li>
        </ul>
    </div>
</nav>

<main class="container">
    <div class="page-header">
        <h2>Расписание</h2>
        <button class="btn" onclick="openEditModal()">Добавить запись</button>
    </div>

    <div id="message-container"></div>

    <div class="table-container">
        <table id="schedules-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Клиент</th>
                <th>Тренер</th>
                <th>Тренировка</th>
                <th>Дата</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody id="schedules-tbody">
            <tr>
                <td colspan="6" class="loading">Загрузка...</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Modal для редактирования -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeEditModal()">&times;</span>
        <h3 id="modal-title">Добавить запись в расписание</h3>
        <form id="schedule-form">
            <div class="form-group">
                <label for="schedule-client-id">Клиент:</label>
                <select id="schedule-client-id" required>
                    <option value="">Выберите клиента</option>
                </select>
            </div>
            <div class="form-group">
                <label for="schedule-coach-id">Тренер:</label>
                <select id="schedule-coach-id" required>
                    <option value="">Выберите тренера</option>
                </select>
            </div>
            <div class="form-group">
                <label for="schedule-workout-id">Тренировка:</label>
                <select id="schedule-workout-id" required>
                    <option value="">Выберите тренировку</option>
                </select>
            </div>
            <div class="form-group">
                <label for="schedule-date">Дата:</label>
                <input type="date" id="schedule-date" required>
            </div>
            <div class="form-group">
                <button type="submit" class="btn">Сохранить</button>
                <button type="button" class="btn" onclick="closeEditModal()">Отмена</button>
            </div>
        </form>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <p>&copy; 2024 Fitness Club. Все права защищены.</p>
    </div>
</footer>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/schedules.js"></script>
</body>
</html>
